- id: 10
  title: Workflow & Metadata Survey Tools
  description: 'Developed for the NOAA Fisheries Passive Acoustic Monitoring Strategic
    Initiative, this suite of tools allows users to easily build flowcharts, align
    custom surveys (think: metadata) to these flowcharts, and provides an interface
    for users to complete surveys for each workflow component. There are also tools
    for evaluating survey results. While this was designed for the PAM-SI, users can
    work with the browser-based tools to download workflows (svg, xml, and png) and
    survey results (csv) for their workflows. They can also use the repository template
    to rebuild their own personalized version of this repository.'
  url: https://github.com/nmfs-ost/PAM-workflows-template
  tools:
  - Data Management
  - Visualisation
  - Project Management
  keywords:
  - r
  - python
  - quarto
  - template
  - workflow
  - interactive
  image: 'p-a-m_logo.jpg'
  author: Shannon Rankin/ NOAA Fisheries
  date_added: '2026-10-23'
